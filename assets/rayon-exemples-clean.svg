<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" role="img" aria-labelledby="title desc">
  <title id="title">Trois exemples de rayons de courbure</title>
  <desc id="desc">Trois vrais cercles, tous tangents au même point sur le ski, pour montrer la différence entre un petit, moyen et grand rayon.</desc>

  <defs>
    <clipPath id="solidArcClip">
      <rect x="58" y="32" width="92" height="196" rx="8"/>
    </clipPath>
  </defs>

  <rect width="700" height="260" fill="#ffffff"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="24" y="28" font-size="16" font-weight="800" fill="#aa6f27" letter-spacing="1">
      TROIS EXEMPLES DE RAYONS
    </text>
    <text x="24" y="47" font-size="12" fill="#647984">
      Les trois cercles partent du même point de contact sur le ski : plus le rayon est petit, plus le virage est serré.
    </text>

    <rect x="18" y="58" width="664" height="184" rx="12" fill="#fbfbfb" stroke="#e6e6e6"/>

    <g transform="translate(78,92)">
      <rect x="0" y="0" width="10" height="124" rx="5" fill="#111111"/>
      <rect x="1.3" y="4" width="7.4" height="116" rx="3.7" fill="#18b394"/>
      <rect x="3" y="12" width="4" height="96" rx="2" fill="#3fd6bb" opacity="0.55"/>
    </g>

    <circle cx="92" cy="150" r="2.8" fill="#111111"/>

    <line x1="92" y1="150" x2="650" y2="150" stroke="#111111" stroke-width="2"/>

    <circle cx="147" cy="150" r="55"
            fill="none"
            stroke="#111111"
            stroke-width="4"
            stroke-dasharray="14 11"/>

    <circle cx="212" cy="150" r="120"
            fill="none"
            stroke="#111111"
            stroke-width="4"
            stroke-dasharray="14 11"/>

    <circle cx="372" cy="150" r="280"
            fill="none"
            stroke="#111111"
            stroke-width="4"
            stroke-dasharray="14 11"/>

    <g clip-path="url(#solidArcClip)">
      <circle cx="147" cy="150" r="55"  fill="none" stroke="#111111" stroke-width="5"/>
      <circle cx="212" cy="150" r="120" fill="none" stroke="#111111" stroke-width="5"/>
      <circle cx="372" cy="150" r="280" fill="none" stroke="#111111" stroke-width="5"/>
    </g>

    <text x="178" y="132" font-size="24" font-weight="800" fill="#111111">R11</text>
    <text x="300" y="132" font-size="24" font-weight="800" fill="#111111">R15</text>
    <text x="505" y="132" font-size="24" font-weight="800" fill="#111111">R20+</text>

    <text x="170" y="224" font-size="11" fill="#6b7280">virage serré</text>
    <text x="288" y="224" font-size="11" fill="#6b7280">rayon moyen</text>
    <text x="503" y="224" font-size="11" fill="#6b7280">grandes courbes</text>
  </g>
</svg>