<!-- SPORT GOOD DEAL · V07.25 · schéma rayons lisibilité renforcée -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Comparaison des rayons de courbure R11, R15 et R20+</title>
  <desc id="desc">Un ski vertical sert de point commun à trois cercles de rayon croissant : vert pour R11, bleu pour R15 et rouge pour R20+.</desc>
  <rect width="1536" height="1024" fill="#ffffff"/>

  <defs>
    <filter id="skiShadow" x="-50%" y="-20%" width="200%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#14242b" flood-opacity=".18"/>
    </filter>
  </defs>
  <!-- Axe commun -->
  <line x1="183" y1="516" x2="1202" y2="516" stroke="#102a43" stroke-width="1.8"/>

  <!-- R11 -->
  <circle cx="371" cy="516" r="188" fill="none"
          stroke="#84c400" stroke-width="4.2"
          stroke-dasharray="20 13" stroke-linecap="round"/>
  <circle cx="371" cy="516" r="188" fill="none"
          stroke="#84c400" stroke-width="5.6"
          pathLength="100" stroke-dasharray="13 87" stroke-dashoffset="-42"
          stroke-linecap="round"/>

  <!-- R15 -->
  <circle cx="503" cy="516" r="320" fill="none"
          stroke="#1378e8" stroke-width="4.2"
          stroke-dasharray="20 13" stroke-linecap="round"/>
  <circle cx="503" cy="516" r="320" fill="none"
          stroke="#1378e8" stroke-width="5.6"
          pathLength="100" stroke-dasharray="13 87" stroke-dashoffset="-42"
          stroke-linecap="round"/>

  <!-- R20+ -->
  <circle cx="668" cy="516" r="485" fill="none"
          stroke="#ff1528" stroke-width="4.2"
          stroke-dasharray="20 13" stroke-linecap="round"/>
  <circle cx="668" cy="516" r="485" fill="none"
          stroke="#ff1528" stroke-width="5.6"
          pathLength="100" stroke-dasharray="13 87" stroke-dashoffset="-42"
          stroke-linecap="round"/>

  <!-- Repères sur l'axe -->
  <circle cx="369" cy="516" r="13" fill="#84c400"/>
  <circle cx="660" cy="516" r="13" fill="#1378e8"/>
  <circle cx="986" cy="516" r="13" fill="#ff1528"/>

  <!-- Légendes -->
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(300 376)">
      <text x="0" y="0" font-size="66" font-weight="900" fill="#84c400">R11</text>
      <text x="2" y="31" font-size="31" font-weight="800" fill="#102a43">ski agile,</text>
      <text x="2" y="63" font-size="31" font-weight="800" fill="#84c400">virage serré</text>
    </g>

    <g transform="translate(592 376)">
      <text x="0" y="0" font-size="66" font-weight="900" fill="#1378e8">R15</text>
      <text x="2" y="31" font-size="30" font-weight="800" fill="#102a43">ski polyvalent,</text>
      <text x="2" y="63" font-size="30" font-weight="800" fill="#1378e8">multivirage</text>
      <text x="2" y="88" font-size="21" font-weight="500" fill="#102a43">(à la fois court et long)</text>
    </g>

    <g transform="translate(895 376)">
      <text x="0" y="0" font-size="66" font-weight="900" fill="#ff1528">R20+</text>
      <text x="2" y="31" font-size="30" font-weight="800" fill="#102a43">ski stable et rapide,</text>
      <text x="2" y="63" font-size="30" font-weight="800" fill="#ff1528">grande courbe</text>
    </g>
  </g>
</svg>
