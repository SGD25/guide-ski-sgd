<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" role="img" aria-labelledby="title desc">
<title id="title">Trois rayons de courbure</title>
<desc id="desc">Trois vrais cercles de tailles différentes, tous tangents au même point sur le côté du ski.</desc>

<rect width="700" height="320" fill="#ffffff"/>

<g font-family="Arial,Helvetica,sans-serif">
  <!-- ski -->
  <g transform="translate(50,92)">
    <path d="M11 0 C17 4 18 13 17 25 L15 108 C15 122 13 134 10 142 C7 134 5 122 5 108 L3 25 C2 13 4 4 11 0Z"
          fill="#16b493" stroke="#14313c" stroke-width="2.2"/>
    <path d="M8 11 L8 127" stroke="#ffffff" stroke-opacity=".26" stroke-width="2"/>
  </g>

  <!-- point de tangence commun -->
  <circle cx="70" cy="160" r="3.4" fill="#111111"/>

  <!-- axe -->
  <line x1="70" y1="160" x2="650" y2="160" stroke="#111111" stroke-width="2.4"/>

  <!-- 3 vrais cercles, tous tangents en x=70 -->
  <circle cx="140" cy="160" r="70"
          fill="none" stroke="#111111" stroke-width="3.4" stroke-dasharray="13 10"/>
  <circle cx="225" cy="160" r="155"
          fill="none" stroke="#111111" stroke-width="3.4" stroke-dasharray="13 10"/>
  <circle cx="355" cy="160" r="285"
          fill="none" stroke="#111111" stroke-width="3.4" stroke-dasharray="13 10"/>

  <!-- portions pleines près du ski, exactement sur les mêmes cercles -->
  <path d="M90.5 110.5 A70 70 0 0 0 90.5 209.5"
        fill="none" stroke="#111111" stroke-width="5.2" stroke-linecap="round"/>
  <path d="M115.4 50.4 A155 155 0 0 0 115.4 269.6"
        fill="none" stroke="#111111" stroke-width="5.2" stroke-linecap="round"/>
  <path d="M153.5 -41.5 A285 285 0 0 0 153.5 361.5"
        fill="none" stroke="#111111" stroke-width="5.2" stroke-linecap="round"/>

  <!-- labels -->
  <text x="164" y="145" text-anchor="middle" font-size="25" font-weight="900" fill="#111111">R11</text>
  <text x="164" y="180" text-anchor="middle" font-size="11.5" fill="#65737a">virage serré</text>

  <text x="290" y="145" text-anchor="middle" font-size="25" font-weight="900" fill="#111111">R15</text>
  <text x="290" y="180" text-anchor="middle" font-size="11.5" fill="#65737a">rayon moyen</text>

  <text x="505" y="145" text-anchor="middle" font-size="25" font-weight="900" fill="#111111">R20+</text>
  <text x="505" y="180" text-anchor="middle" font-size="11.5" fill="#65737a">grandes courbes</text>
</g>
</svg>