<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" role="img" aria-labelledby="t d">
<title id="t">Trois exemples de rayons de courbure</title>
<desc id="d">Pour chaque exemple, la partie pleine représente la portion de courbe du ski et les pointillés prolongent exactement la même courbe pour former le cercle imaginaire. Le cercle rouge est petit, le bleu moyen et le vert beaucoup plus grand.</desc>

<defs>
  <clipPath id="clip-red"><rect x="18" y="60" width="208" height="184" rx="11"/></clipPath>
  <clipPath id="clip-blue"><rect x="246" y="60" width="208" height="184" rx="11"/></clipPath>
  <clipPath id="clip-green"><rect x="474" y="60" width="208" height="184" rx="11"/></clipPath>
</defs>

<rect width="700" height="260" rx="14" fill="#fff"/>
<g font-family="Arial,Helvetica,sans-serif">
  <text x="24" y="27" font-size="16" font-weight="800" fill="#aa6f27" letter-spacing="1">TROIS EXEMPLES DE RAYONS</text>
  <text x="24" y="49" font-size="12" fill="#647984">La partie pleine est la courbure du ski ; les pointillés prolongent son cercle imaginaire.</text>

  <!-- PETIT RAYON -->
  <g>
    <rect x="18" y="60" width="208" height="184" rx="11" fill="#fffaf9" stroke="#ead9d7"/>
    <text x="122" y="89" text-anchor="middle" font-size="20" font-weight="900" fill="#d41f1f">12–14 m</text>
    <text x="122" y="109" text-anchor="middle" font-size="13" font-weight="700" fill="#203a47">virages courts</text>

    <g clip-path="url(#clip-red)">
      <!-- cercle imaginaire complet -->
      <circle cx="122" cy="166" r="43"
              fill="none" stroke="#e11c24" stroke-width="2.7"
              stroke-dasharray="7 7" opacity=".58"/>

      <!-- portion correspondant à la ligne de cotes : même cercle, côté gauche -->
      <path d="M122 123 A43 43 0 0 0 122 209"
            fill="none" stroke="#e11c24" stroke-width="6"
            stroke-linecap="round"/>
    </g>

    <text x="122" y="231" text-anchor="middle" font-size="10.5" font-weight="800" fill="#9a5555">PETIT CERCLE</text>
  </g>

  <!-- RAYON MOYEN -->
  <g>
    <rect x="246" y="60" width="208" height="184" rx="11" fill="#f8fbff" stroke="#d8e4f1"/>
    <text x="350" y="89" text-anchor="middle" font-size="20" font-weight="900" fill="#0e66c2">14–17 m</text>
    <text x="350" y="109" text-anchor="middle" font-size="13" font-weight="700" fill="#203a47">polyvalent / all-mountain</text>

    <g clip-path="url(#clip-blue)">
      <!-- cercle imaginaire moyen -->
      <circle cx="369" cy="169" r="68"
              fill="none" stroke="#0e66c2" stroke-width="2.7"
              stroke-dasharray="7 7" opacity=".58"/>

      <!-- même cercle : portion pleine côté gauche -->
      <path d="M369 101 A68 68 0 0 0 369 237"
            fill="none" stroke="#0e66c2" stroke-width="6"
            stroke-linecap="round"/>
    </g>

    <text x="350" y="231" text-anchor="middle" font-size="10.5" font-weight="800" fill="#537fa7">CERCLE MOYEN</text>
  </g>

  <!-- GRAND RAYON -->
  <g>
    <rect x="474" y="60" width="208" height="184" rx="11" fill="#f9fcf7" stroke="#dbe8d7"/>
    <text x="578" y="89" text-anchor="middle" font-size="20" font-weight="900" fill="#2d7e2a">17–20 m</text>
    <text x="578" y="109" text-anchor="middle" font-size="13" font-weight="700" fill="#203a47">grandes courbes</text>

    <g clip-path="url(#clip-green)">
      <!-- immense cercle imaginaire : seule une partie tient dans la vignette -->
      <circle cx="684" cy="169" r="132"
              fill="none" stroke="#2d7e2a" stroke-width="2.7"
              stroke-dasharray="7 7" opacity=".58"/>

      <!-- portion pleine sur exactement le même cercle -->
      <path d="M570 103
               A132 132 0 0 0 570 235"
            fill="none" stroke="#2d7e2a" stroke-width="6"
            stroke-linecap="round"/>
    </g>

    <text x="578" y="231" text-anchor="middle" font-size="10.5" font-weight="800" fill="#688b63">TRÈS GRAND CERCLE</text>
  </g>
</g>
</svg>