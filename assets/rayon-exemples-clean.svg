<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" role="img" aria-labelledby="t d">
<title id="t">Trois exemples de rayons de courbure</title>
<desc id="d">Trois courbes volontairement très différentes illustrent un petit, un moyen et un grand rayon. La partie pleine représente la courbure du ski, les pointillés prolongent le cercle imaginaire.</desc>
<rect width="700" height="260" rx="14" fill="#fff"/>
<g font-family="Arial,Helvetica,sans-serif">
  <text x="24" y="27" font-size="16" font-weight="800" fill="#aa6f27" letter-spacing="1">TROIS EXEMPLES DE RAYONS</text>
  <text x="24" y="49" font-size="12" fill="#647984">Petit rayon = virage serré · grand rayon = grande courbe.</text>

  <!-- PETIT RAYON -->
  <g transform="translate(18,60)">
    <rect x="0" y="0" width="208" height="184" rx="11" fill="#fffaf9" stroke="#ead9d7"/>
    <text x="104" y="29" text-anchor="middle" font-size="20" font-weight="900" fill="#d41f1f">12–14 m</text>
    <text x="104" y="49" text-anchor="middle" font-size="13" font-weight="700" fill="#203a47">virages courts</text>

    <!-- portion du ski : très bombée vers la gauche -->
    <path d="M166 67
             C100 73 61 98 58 130
             C55 159 87 181 148 192"
          fill="none" stroke="#e11c24" stroke-width="6" stroke-linecap="round"/>

    <!-- prolongement du cercle imaginaire -->
    <path d="M148 192
             C74 211 26 180 25 132
             C24 82 77 49 166 57"
          fill="none" stroke="#e11c24" stroke-width="2.8" stroke-dasharray="7 7"
          stroke-linecap="round" opacity=".58"/>

    <line x1="154" y1="71" x2="154" y2="190" stroke="#d6a0a0" stroke-width="1.2" stroke-dasharray="3 4"/>
    <text x="104" y="170" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9a5555">TRÈS SERRÉ</text>
  </g>

  <!-- RAYON MOYEN -->
  <g transform="translate(246,60)">
    <rect x="0" y="0" width="208" height="184" rx="11" fill="#f8fbff" stroke="#d8e4f1"/>
    <text x="104" y="29" text-anchor="middle" font-size="20" font-weight="900" fill="#0e66c2">14–17 m</text>
    <text x="104" y="49" text-anchor="middle" font-size="13" font-weight="700" fill="#203a47">polyvalent / all-mountain</text>

    <!-- portion du ski : courbure intermédiaire -->
    <path d="M170 67
             C130 75 104 99 101 131
             C98 159 119 181 157 192"
          fill="none" stroke="#0e66c2" stroke-width="6" stroke-linecap="round"/>

    <!-- prolongement du cercle imaginaire -->
    <path d="M157 192
             C100 215 49 187 44 137
             C39 87 83 52 170 57"
          fill="none" stroke="#0e66c2" stroke-width="2.8" stroke-dasharray="7 7"
          stroke-linecap="round" opacity=".58"/>

    <line x1="160" y1="71" x2="160" y2="190" stroke="#a7c5e2" stroke-width="1.2" stroke-dasharray="3 4"/>
    <text x="104" y="170" text-anchor="middle" font-size="10.5" font-weight="700" fill="#537fa7">INTERMÉDIAIRE</text>
  </g>

  <!-- GRAND RAYON -->
  <g transform="translate(474,60)">
    <rect x="0" y="0" width="208" height="184" rx="11" fill="#f9fcf7" stroke="#dbe8d7"/>
    <text x="104" y="29" text-anchor="middle" font-size="20" font-weight="900" fill="#2d7e2a">17–20 m</text>
    <text x="104" y="49" text-anchor="middle" font-size="13" font-weight="700" fill="#203a47">grandes courbes</text>

    <!-- portion du ski : presque droite, très grand rayon -->
    <path d="M174 67
             C156 81 148 103 148 131
             C148 159 155 180 170 192"
          fill="none" stroke="#2d7e2a" stroke-width="6" stroke-linecap="round"/>

    <!-- prolongement : immense cercle, très ouvert -->
    <path d="M170 192
             C139 224 78 218 48 178
             C16 136 28 82 73 56
             C101 40 136 42 174 57"
          fill="none" stroke="#2d7e2a" stroke-width="2.8" stroke-dasharray="7 7"
          stroke-linecap="round" opacity=".58"/>

    <line x1="172" y1="71" x2="172" y2="190" stroke="#b0cca9" stroke-width="1.2" stroke-dasharray="3 4"/>
    <text x="104" y="170" text-anchor="middle" font-size="10.5" font-weight="700" fill="#688b63">TRÈS OUVERT</text>
  </g>
</g>
</svg>