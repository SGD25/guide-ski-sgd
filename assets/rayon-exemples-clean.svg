<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 585" role="img" aria-labelledby="title desc">
<title id="title">Comparaison des rayons de courbure</title>
<desc id="desc">Trois vrais cercles tangents au même point sur un ski Rossignol : R11, R15 et R20+.</desc>
<rect width="700" height="585" fill="#fff"/>
<g font-family="Arial,Helvetica,sans-serif">
<image href="./rossignol-photo-reelle.avif" x="44" y="178" width="84" height="230" preserveAspectRatio="xMidYMid meet"/>
<circle cx="100" cy="292.5" r="3.5" fill="#122a35"/>
<line x1="100" y1="292.5" x2="645" y2="292.5" stroke="#122a35" stroke-width="2.4"/>
<circle cx="205" cy="292.5" r="105" fill="none" stroke="#c5d600" stroke-width="3.2" stroke-dasharray="12 10" stroke-linecap="round"/>
<circle cx="205" cy="292.5" r="105" fill="none" stroke="#122a35" stroke-width="5" pathLength="100" stroke-dasharray="28 72" stroke-dashoffset="-36" stroke-linecap="round"/>
<circle cx="275" cy="292.5" r="175" fill="none" stroke="#122a35" stroke-width="3.2" stroke-dasharray="12 10" stroke-linecap="round"/>
<circle cx="275" cy="292.5" r="175" fill="none" stroke="#122a35" stroke-width="5" pathLength="100" stroke-dasharray="28 72" stroke-dashoffset="-36" stroke-linecap="round"/>
<circle cx="360" cy="292.5" r="260" fill="none" stroke="#122a35" stroke-width="3.2" stroke-dasharray="12 10" stroke-linecap="round"/>
<circle cx="360" cy="292.5" r="260" fill="none" stroke="#122a35" stroke-width="5" pathLength="100" stroke-dasharray="28 72" stroke-dashoffset="-36" stroke-linecap="round"/>
<circle cx="205" cy="292.5" r="8" fill="#c5d600"/><circle cx="275" cy="292.5" r="8" fill="#122a35"/><circle cx="360" cy="292.5" r="8" fill="#122a35"/>
<g transform="translate(154 221)"><text x="0" y="0" font-size="36" font-weight="900" fill="#c5d600">R11</text><text x="0" y="27" font-size="17" font-weight="700" fill="#122a35">ski agile,</text><text x="0" y="49" font-size="17" font-weight="700" fill="#122a35">virage serré</text></g>
<g transform="translate(292 205)"><text x="0" y="0" font-size="36" font-weight="900" fill="#122a35">R15</text><text x="0" y="27" font-size="16.5" font-weight="700" fill="#122a35">ski polyvalent,</text><text x="0" y="49" font-size="16.5" font-weight="700" fill="#122a35">multivirage</text><text x="0" y="69" font-size="12.5" font-weight="600" fill="#63737a">(à la fois court et long)</text></g>
<g transform="translate(466 211)"><text x="0" y="0" font-size="36" font-weight="900" fill="#122a35">R20+</text><text x="0" y="27" font-size="16.5" font-weight="700" fill="#122a35">ski stable et rapide,</text><text x="0" y="49" font-size="16.5" font-weight="700" fill="#122a35">grande courbe</text></g>
</g></svg>