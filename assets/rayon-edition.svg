<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="t d">
<title id="t">Rayon de courbure d'un ski</title>
<desc id="d">Un grand ski vu de dessus à gauche, un cercle imaginaire à droite avec un petit ski posé sur le cercle, et une flèche montrant le rayon de courbure.</desc>
<defs>
  <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0 0L10 5L0 10Z" fill="#18394a"/>
  </marker>
  <marker id="a2" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto">
    <path d="M10 0L0 5L10 10Z" fill="#18394a"/>
  </marker>
</defs>
<rect width="1100" height="720" fill="#fbfaf6"/>

<!-- GRAND SKI -->
<g transform="translate(150 75)">
  <path d="M72 0
           C45 2 28 28 30 62
           C32 110 48 170 52 225
           C54 255 53 292 48 330
           C41 385 28 450 30 505
           C31 540 47 560 72 562
           C97 560 113 540 114 505
           C116 450 103 385 96 330
           C91 292 90 255 92 225
           C96 170 112 110 114 62
           C116 28 99 2 72 0Z"
        fill="#f7efd9" stroke="#202020" stroke-width="4"/>
  <!-- sidecut highlighted -->
  <path d="M110 42 C99 140 92 210 92 278 C92 346 101 430 110 518"
        fill="none" stroke="#e74b35" stroke-width="5" stroke-linecap="round"/>
  <line x1="72" y1="-10" x2="72" y2="574" stroke="#9aa7ad" stroke-width="1.5" stroke-dasharray="7 8"/>
</g>

<!-- LONGUEUR -->
<line x1="112" y1="80" x2="112" y2="635" stroke="#18394a" stroke-width="3" marker-start="url(#a2)" marker-end="url(#a)"/>
<line x1="97" y1="80" x2="150" y2="80" stroke="#93a1a8" stroke-width="1.5" stroke-dasharray="6 6"/>
<line x1="97" y1="635" x2="150" y2="635" stroke="#93a1a8" stroke-width="1.5" stroke-dasharray="6 6"/>
<text x="54" y="350" transform="rotate(-90 54 350)" font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="#18394a" text-anchor="middle">longueur du ski (ex : 170 cm)</text>

<!-- COURBURE -->
<circle cx="242" cy="350" r="7" fill="#e74b35"/>
<line x1="242" y1="350" x2="315" y2="407" stroke="#e74b35" stroke-width="2"/>
<rect x="300" y="392" width="132" height="46" rx="8" fill="#fff" stroke="#e7ded4"/>
<text x="366" y="421" font-family="Arial,sans-serif" font-size="19" font-weight="800" fill="#e74b35" text-anchor="middle">courbure</text>

<!-- CERCLE IMAGINAIRE -->
<circle cx="765" cy="360" r="275" fill="none" stroke="#4f9554" stroke-width="3" stroke-dasharray="12 10"/>

<!-- PETIT SKI SUR LE CERCLE -->
<g transform="translate(487 328) rotate(2)">
  <path d="M10 0 C5 1 2 7 2 14 L2 55 C2 62 5 68 10 69 C15 68 18 62 18 55 L18 14 C18 7 15 1 10 0Z"
        fill="#f7efd9" stroke="#e74b35" stroke-width="2.2"/>
  <path d="M17 7 C14 21 13 34 14 48 C15 55 16 60 17 63" fill="none" stroke="#1d64e6" stroke-width="2"/>
</g>

<!-- RAYON -->
<line x1="505" y1="360" x2="765" y2="360" stroke="#18394a" stroke-width="3.2" marker-start="url(#a2)" marker-end="url(#a)"/>
<rect x="555" y="315" width="195" height="66" rx="10" fill="#eef2f4"/>
<text x="652" y="342" font-family="Arial,sans-serif" font-size="19" font-weight="800" fill="#18394a" text-anchor="middle">rayon (de courbure)</text>
<text x="652" y="366" font-family="Arial,sans-serif" font-size="16" fill="#18394a" text-anchor="middle">(ex : 15 m)</text>

<!-- CERCLE LABEL -->
<line x1="876" y1="617" x2="924" y2="654" stroke="#4f9554" stroke-width="2"/>
<circle cx="876" cy="617" r="5" fill="#4f9554"/>
<rect x="910" y="638" width="172" height="44" rx="8" fill="#eef7ec"/>
<text x="996" y="666" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#3f7d45" text-anchor="middle">(cercle imaginaire)</text>
</svg>