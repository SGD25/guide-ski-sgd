<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Comprendre le rayon d'un ski</title>
<desc id="desc">Un ski vu de dessus avec sa ligne de cotes, un grand cercle imaginaire et une flèche représentant le rayon théorique.</desc>
<defs>
  <linearGradient id="ski" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#244958"/>
    <stop offset=".55" stop-color="#163846"/>
    <stop offset="1" stop-color="#102c38"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14303b" flood-opacity=".16"/>
  </filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#173847"/>
  </marker>
</defs>

<rect width="1200" height="720" fill="#faf9f5"/>
<text x="42" y="52" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="3" fill="#ad7c45">COMPRENDRE LE RAYON</text>
<line x1="42" y1="70" x2="1158" y2="70" stroke="#d9dfdc"/>

<!-- Grand cercle imaginaire -->
<circle cx="852" cy="365" r="540" fill="none" stroke="#5fa49e" stroke-width="3" stroke-dasharray="12 11" opacity=".9"/>
<circle cx="852" cy="365" r="7" fill="#173847"/>

<!-- Ski -->
<g filter="url(#shadow)">
  <path d="M244 96
           C220 101 207 122 206 153
           C207 218 220 280 226 335
           C229 362 229 388 225 420
           C219 475 207 538 208 594
           C209 625 222 645 244 650
           C266 645 278 626 279 595
           C279 540 267 476 261 420
           C257 388 257 362 260 335
           C266 280 279 218 280 153
           C279 122 266 101 244 96 Z"
        fill="url(#ski)" stroke="#0e2631" stroke-width="4"/>
  <path d="M260 139
           C259 219 248 283 244 338
           C242 366 242 390 244 420
           C248 473 258 535 260 602"
        fill="none" stroke="#d79a50" stroke-width="5" stroke-linecap="round"/>
  <path d="M244 111 L244 634" stroke="#78909a" stroke-width="1.5" stroke-dasharray="7 9" opacity=".65"/>
</g>

<!-- Largeur / ligne de cotes -->
<g font-family="Arial,sans-serif">
  <line x1="292" y1="274" x2="260" y2="310" stroke="#ad7c45" stroke-width="2"/>
  <circle cx="260" cy="310" r="5" fill="#ad7c45"/>
  <rect x="294" y="238" width="222" height="63" rx="10" fill="#fff" stroke="#e0e5e2"/>
  <text x="310" y="262" font-size="17" font-weight="800" fill="#173847">LIGNE DE COTES</text>
  <text x="310" y="283" font-size="12" fill="#6c7d83">La courbure latérale du ski.</text>
</g>

<!-- Rayon -->
<line x1="852" y1="365" x2="260" y2="365" stroke="#173847" stroke-width="4" marker-end="url(#arrow)"/>
<circle cx="260" cy="365" r="7" fill="#d97455"/>
<rect x="515" y="324" width="223" height="75" rx="12" fill="#eef4f2" stroke="#d9e3df"/>
<text x="536" y="350" font-family="Arial,sans-serif" font-size="20" font-weight="800" fill="#173847">RAYON THÉORIQUE</text>
<text x="536" y="374" font-family="Arial,sans-serif" font-size="13" fill="#64757b">Distance entre le centre du cercle</text>
<text x="536" y="391" font-family="Arial,sans-serif" font-size="13" fill="#64757b">imaginaire et la ligne de cotes.</text>

<!-- Cercle -->
<line x1="1007" y1="596" x2="1080" y2="640" stroke="#5fa49e" stroke-width="2"/>
<circle cx="1007" cy="596" r="5" fill="#5fa49e"/>
<rect x="1040" y="626" width="136" height="42" rx="8" fill="#eff7f2"/>
<text x="1053" y="652" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#3b756f">CERCLE IMAGINAIRE</text>

<!-- Mini explication -->
<g font-family="Arial,sans-serif">
  <rect x="42" y="565" width="440" height="112" rx="12" fill="#f0f3f1"/>
  <text x="62" y="592" font-size="16" font-weight="800" fill="#173847">Comment le lire ?</text>
  <text x="62" y="620" font-size="13" fill="#596c73">
    <tspan x="62" dy="0"><tspan font-weight="700">Rayon court :</tspan> virages plus serrés, ski plus vif.</tspan>
    <tspan x="62" dy="24"><tspan font-weight="700">Rayon long :</tspan> courbes plus amples, davantage de stabilité.</tspan>
  </text>
</g>

<!-- Caption -->
<text x="42" y="701" font-family="Arial,sans-serif" font-size="11" fill="#8a999e">Schéma de principe : le cercle sert à visualiser la géométrie. Le rayon réel dépend de la longueur et de la ligne de cotes du ski.</text>
</svg>