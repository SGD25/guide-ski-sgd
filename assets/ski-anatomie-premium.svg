<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 960 340" role="img" aria-labelledby="titre description">
<title id="titre">Ski alpin — vue de dessus</title>
<desc id="description">Ski de piste contemporain sombre, long et étroit, avec spatule à gauche, talon à droite, lignes de cotes et fixation mécanique détaillée au centre.</desc>
