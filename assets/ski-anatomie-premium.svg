<linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#182b39"/><stop offset=".22" stop-color="#4b5660"/><stop offset=".45" stop-color="#162e3b"/><stop offset=".7" stop-color="#12222b"/><stop offset="1" stop-color="#49565c"/></linearGradient>
<linearGradient id="metal" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#9da8aa"/><stop offset=".35" stop-color="#e8dfc9"/><stop offset=".5" stop-color="#5a6972"/><stop offset=".78" stop-color="#1a303e"/><stop offset="1" stop-color="#d0b18a"/></linearGradient>
<linearGradient id="gold" x1="0" x2="1"><stop stop-color="#9b7143"/><stop offset=".55" stop-color="#e9cda4"/><stop offset="1" stop-color="#8e633b"/></linearGradient>
<linearGradient id="carb" x1="0" x2="1"><stop stop-color="#0c161e"/><stop offset=".55" stop-color="#34444b"/><stop offset="1" stop-color="#0b151c"/></linearGradient>
<filter id="shadow" x="-20%" y="-100%" width="150%" height="300%"><feGaussianBlur stdDeviation="10"/></filter>
<filter id="bindShadow" x="-30%" y="-50%" width="160%" height="200%"><feDropShadow dx="1" dy="5" stdDeviation="4" flood-color="#020910" flood-opacity=".57"/></filter>
<pattern id="carbon" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(25)"><rect width="9" height="9" fill="#1a2b35"/><path d="M0 0h4.5v4.5H0zM4.5 4.5H9V9H4.5z" fill="#40515c" opacity=".32"/></pattern>
