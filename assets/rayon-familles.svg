<svg xmlns="http://www.w3.org/2000/svg" viewBox="65 25 760 455" role="img" aria-labelledby="t d">
<title id="t">Comparaison des rayons de ski</title>
<desc id="d">Trois arcs illustrent les rayons 17 à 20 mètres, 14 à 17 mètres et 12 à 14 mètres, associés respectivement aux grandes courbes, à l'all-mountain et aux virages courts.</desc>
<rect width="760" height="455" fill="#ffffff"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#14242b">
  <text x="86" y="70" font-size="28" font-weight="800">TOP</text>
  <text x="86" y="470" font-size="28" font-weight="800">TAIL</text>

  <!-- ski -->
  <path d="M110 88
           C93 92 88 110 90 137
           C94 191 102 240 103 280
           C102 321 94 369 91 417
           C90 442 96 455 110 458
           C124 455 130 442 129 417
           C126 369 118 321 117 280
           C118 240 126 191 130 137
           C132 110 127 92 110 88Z"
        fill="#fafafa" stroke="#1e1e1e" stroke-width="4"/>

  <!-- large radius -->
  <path d="M325 450 A250 250 0 0 1 325 105"
        fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
  <circle cx="332" cy="93" r="46" fill="#fff" stroke="#111" stroke-width="3"/>
  <text x="332" y="75" text-anchor="middle" font-size="16" font-weight="700">RADIUS</text>
  <text x="332" y="103" text-anchor="middle" font-size="25" font-weight="900">17–20</text>
  <text x="395" y="52" font-size="23" font-weight="800">LONG TURNS</text>

  <!-- all mountain -->
  <path d="M500 450 A200 200 0 0 1 500 150"
        fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
  <circle cx="505" cy="137" r="46" fill="#fff" stroke="#111" stroke-width="3"/>
  <text x="505" y="119" text-anchor="middle" font-size="16" font-weight="700">RADIUS</text>
  <text x="505" y="147" text-anchor="middle" font-size="25" font-weight="900">14–17</text>
  <text x="565" y="92" font-size="23" font-weight="800">ALL MOUNTAIN</text>

  <!-- short radius -->
  <path d="M665 415 A145 145 0 0 1 665 205"
        fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
  <circle cx="670" cy="193" r="46" fill="#fff" stroke="#111" stroke-width="3"/>
  <text x="670" y="175" text-anchor="middle" font-size="16" font-weight="700">RADIUS</text>
  <text x="670" y="203" text-anchor="middle" font-size="25" font-weight="900">12–14</text>
  <text x="726" y="170" font-size="23" font-weight="800">SHORT TURNS</text>
</g>
</svg>